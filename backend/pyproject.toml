[project]
name = "ai-career-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Career Assistant"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # function calls in argument defaults — required by FastAPI's Depends()
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Alembic autogenerates these; don't fight its style.
"alembic/versions/*" = ["E501", "I001", "UP"]
"alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
