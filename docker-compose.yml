# ============================================================
# AI Career Assistant — full stack.
#
#   docker compose up --build          # build + run mysql, backend, frontend
#   open http://localhost:5173
#
# Values come from the root .env file (copy .env.example -> .env first).
# MySQL has NO published port here — it is reachable only from the other
# containers on the `aica-net` network. For host tooling (MySQL Workbench)
# docker-compose.override.yml adds a loopback-only port in local dev.
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: aica-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aica-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aica-backend:latest
    container_name: aica-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      # Published for API docs / debugging. The browser app does NOT use this
      # port — it calls /api on the frontend origin, which nginx proxies.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aica-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => the bundle calls "/api" on its own origin (nginx proxies it).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: aica-frontend:latest
    container_name: aica-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - aica-net

volumes:
  mysql_data:

networks:
  aica-net:
    driver: bridge
